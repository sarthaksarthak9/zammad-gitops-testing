apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zammad
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cloudraftio/infra.git
    targetRevision: main
    path: apps/zammad/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: zammad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
