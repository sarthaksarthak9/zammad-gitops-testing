apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zammad

resources:
  - namespace.yaml
  - cnpg-cluster.yaml
  - cnpg-backup.yaml
  - secretstore.yaml
  - externalsecret-pg-backup-s3.yaml

helmCharts:
  - name: zammad
    repo: https://zammad.github.io/zammad-helm
    version: 16.4.6
    releaseName: zammad
    namespace: zammad
    valuesFile: zammad-values.yaml
